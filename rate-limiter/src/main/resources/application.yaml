server:
  port: 8082

spring:
  application:
    name: rate-limiter-service

  config:
    import: "optional:configserver:http://localhost:8888"

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: refresh,busrefresh,health