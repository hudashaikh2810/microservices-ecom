server:
  port: 8082

spring:
  application:
    name: rate-limiter-service

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health