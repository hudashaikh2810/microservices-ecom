name: rate-limiter Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'rate-limiter/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run tests
        run: ./mvnw test
      - name: Build jar
        run: ./mvnw package -DskipTests
      - name: Build Docker image
        run: docker build -t rate-limiter-service .